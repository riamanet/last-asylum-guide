function showCat(c){let target=null;document.querySelectorAll('.drop').forEach(d=>{if(d.dataset.row.split(',').includes(c))target=d});if(!target)return;const same=target.dataset.open===c&&!target.classList.contains('hidden');document.querySelectorAll('.drop').forEach(d=>{d.classList.add('hidden');d.dataset.open=''});document.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-expanded','false'));if(!same){target.innerHTML=guides.filter(g=>g.category===c).map(row).join('');target.dataset.open=c;target.classList.remove('hidden');document.querySelector(`[data-c="${c}"]`).setAttribute('aria-expanded','true');requestAnimationFrame(()=>target.scrollIntoView({behavior:'smooth',block:'nearest'}))}}
