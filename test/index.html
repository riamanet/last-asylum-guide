const panel=document.querySelector('#panel'),panelItems=document.querySelector('#panelItems'),panelTitle=document.querySelector('#panelTitle');
function row(g){if(g.url)return `<a class="item" href="${g.url}" target="_blank" rel="noopener">${g.title}<em>›</em></a>`;return `<button class="item" onclick="openGuide(${guides.indexOf(g)})">${g.title}<em>›</em></button>`}
function openPanel(title,gs){panelTitle.textContent=title;panelItems.innerHTML=gs.length?gs.map(row).join(''):'<div class="empty">공략이 없습니다.</div>';panel.classList.remove('hidden');requestAnimationFrame(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}))}
function hidePanel(){panel.classList.add('hidden');document.querySelector('.stage').scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{const c=b.dataset.c;openPanel(cats[c][1],guides.filter(g=>g.category===c))}));
document.querySelector('#panelClose').onclick=hidePanel;
function doSearch(){const q=document.querySelector('#q').value.trim().toLowerCase();if(!q)return;const gs=guides.filter(g=>(g.title+' '+cats[g.category][1]).toLowerCase().includes(q));openPanel('검색 결과',gs)}
document.querySelector('#searchBtn').onclick=doSearch;document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch()}});
function renderGuide(i){const g=guides[i];if(!g||g.url)return;document.querySelector('#vtitle').textContent=g.title;document.querySelector('#vimages').innerHTML=g.images.map(src=>'<img src="'+src+'" loading="lazy" alt="'+g.title+'">').join('');document.querySelector('#vnote').innerHTML=g.title==='프레이야 구매방법'?'<div class="note"><b>VIP 1, 3, 4, 7 구매</b><div>최저가 216,500원 / 조각 340개로 4성</div></div>':'';document.querySelector('#viewer').classList.remove('hidden');document.body.style.overflow='hidden'}
function hideGuide(){document.querySelector('#viewer').classList.add('hidden');document.querySelector('#vimages').innerHTML='';document.body.style.overflow=''}
function openGuide(i){renderGuide(i);history.pushState({view:'guide',guide:i},'','#guide-'+i)}
document.querySelector('#close').onclick=()=>{if(location.hash.startsWith('#guide-'))history.back();else hideGuide()};
window.addEventListener('popstate',()=>{const m=location.hash.match(/^#guide-(\d+)$/);if(m){renderGuide(Number(m[1]))}else hideGuide()});
if(location.hash.match(/^#guide-(\d+)$/))renderGuide(Number(RegExp.$1));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.querySelector('#viewer').classList.contains('hidden')){if(location.hash.startsWith('#guide-'))history.back();else hideGuide()}else hidePanel()}});
