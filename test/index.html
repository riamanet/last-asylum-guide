/* 쿠폰코드 바로가기 */
.brandtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.coupon-shortcut{display:inline-flex;flex:none;align-items:center;justify-content:center;gap:7px;padding:11px 12px;min-height:45px;border:1px solid #e3e6eb;border-radius:14px;background:#fff;color:#20232a;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 7px 22px #20242b0a}
.coupon-ico{position:relative;display:inline-flex;font-size:22px;line-height:1.1}
.coupon-dot{position:absolute;top:-4px;right:-5px;width:11px;height:11px;border-radius:50%;background:#ee3949;border:2px solid #fff;box-shadow:0 0 0 1px #ee3949}
.coupon-dot[hidden]{display:none!important}
.coupon-shortcut:has(.coupon-dot:not([hidden])){border-color:#ee8792;box-shadow:0 4px 15px #ee39491a}
.coupon-shortcut:focus-visible{outline:3px solid #a7cdeb;outline-offset:2px}
@media(max-width:380px){.brandtop{gap:7px}.brand h1{font-size:27px}.coupon-shortcut{padding:10px 9px;gap:5px;font-size:12px}}

/* 헤더 2줄 타이포그래피와 세로형 쿠폰 버튼 */
.brandtop{align-items:stretch;gap:12px}
.brandtop>div{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.brandtop small{display:block;font-size:12px;letter-spacing:.035em;line-height:1.25;white-space:nowrap}
.brandtop h1{margin:0;font-size:30px;line-height:1.14;letter-spacing:-1px;white-space:nowrap}
.brandtop .coupon-shortcut{align-self:stretch;min-width:100px;min-height:0;flex-direction:column;gap:3px;padding:5px 12px;border-radius:14px}
.brandtop .coupon-ico{font-size:23px;line-height:1.05}
.brandtop .coupon-label{font-size:14px;line-height:1.2;font-weight:800}
@media(max-width:380px){.brandtop{gap:8px}.brandtop h1{font-size:28px}.brandtop .coupon-shortcut{min-width:91px;padding:5px 8px}.brandtop .coupon-label{font-size:13px}}

.brand:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#09070a 0%,transparent 30%),radial-gradient(ellipse at 80% 15%,transparent,#0005 85%)}
.brandtop{position:relative;z-index:1;align-items:center;gap:8px}
.brandtop>div{gap:3px}
.brandtop small{color:#e4caa1;font-size:clamp(12px,3vw,15px);letter-spacing:.055em;text-shadow:0 2px 5px #000}
.brandtop h1{font-size:clamp(35px,9vw,54px);line-height:1.18;color:#f6e4c4;text-shadow:0 3px 0 #5e3424,0 6px 15px #000;letter-spacing:-1.4px}
.brandtop .coupon-shortcut{border-radius:4px;min-width:96px;min-height:91px;gap:4px;padding:9px 7px;color:#f6e5c7;background:linear-gradient(140deg,#45070de8,#160b10 70%);border:2px ridge #b78953;box-shadow:inset 0 0 0 2px #30170f,0 6px 20px #000a}
.coupon-ico{font-size:32px}.coupon-label{font-family:"Noto Sans KR",sans-serif;font-size:15px;letter-spacing:-.4px}
.coupon-dot{width:18px;height:18px;top:-7px;right:-11px;font-size:10px}
.search{position:relative;top:auto;margin-top:18px;height:62px;background:linear-gradient(120deg,#1d1a1e,#090a0d);border:2px ridge #a67b4e;border-radius:5px;box-shadow:inset 0 0 0 2px #281c16,0 6px 15px #0009}
.search input{color:#f3e6d1;font-family:"Noto Sans KR",sans-serif}.search input::placeholder{color:#b0a5a0}.search span{color:var(--gold)}
.search #searchBtn{background:linear-gradient(#710c18,#2e060a);color:#f8e7cc;border:1px solid #b78753;border-radius:3px;padding:11px 18px;font-size:15px}
.grid{gap:14px 12px;margin-top:21px}
.grid .card{position:relative;isolation:isolate;overflow:hidden;min-height:150px;aspect-ratio:1.58;background:#120d12;border:2px ridge #b88955;border-radius:5px;box-shadow:inset 0 0 0 2px #261811,0 5px 15px #000a;justify-content:end;padding:0}
.grid .card:before{content:"";position:absolute;inset:0 0 32px;background-position:center;background-size:cover;z-index:-2}

function row(g){if(g.url)return `<a class="item" href="${g.url}" target="_blank">${g.title}<em>›</em></a>`;return `<button class="item" onclick="openGuide(${guides.indexOf(g)})">${g.title}<em>›</em></button>`}
function showCat(c){let target=null;document.querySelectorAll('.drop').forEach(d=>{if(d.dataset.row.split(',').includes(c))target=d});if(!target)return;const same=target.dataset.open===c&&!target.classList.contains('hidden');document.querySelectorAll('.drop').forEach(d=>{d.classList.add('hidden');d.dataset.open=''});if(!same){target.innerHTML=guides.filter(g=>g.category===c).map(row).join('');target.dataset.open=c;target.classList.remove('hidden')}}
document.querySelectorAll('.card').forEach(x=>x.onclick=()=>showCat(x.dataset.c));
function renderGuide(i){const g=guides[i];document.querySelector('#vtitle').textContent=g.title;document.querySelector('#vimages').innerHTML=(g.images||[g.image]).map(src=>'<img src="'+src+'?v='+Date.now()+'" alt="'+g.title+'">').join('');const n=document.querySelector('#vnote');n.innerHTML=g.title==='프레이야 구매방법'?'<div class="note"><b>VIP 1, 3, 4, 7 구매</b><span>최저가 216,500원 / 조각 340개로 4성</span></div>':'';document.querySelector('#viewer').classList.remove('hidden');document.body.style.overflow='hidden'}
function hideGuide(){document.querySelector('#viewer').classList.add('hidden');document.body.style.overflow='';document.querySelector('#vimages').innerHTML=''}
function openGuide(i){renderGuide(i);history.pushState({view:'guide',guide:i},'','#guide-'+i)}

if(location.hash.match(/^#guide-(\d+)$/)){const i=Number(RegExp.$1);if(guides[i]&&guides[i].image)renderGuide(i)}
function doSearch(){const q=document.querySelector('#q').value.trim().toLowerCase();if(!q){results.classList.add('hidden');resultitems.innerHTML='';return}const f=guides.filter(g=>(g.title+' '+cats[g.category][1]).toLowerCase().includes(q));resultitems.innerHTML=f.length?f.map(row).join(''):'<div class="empty">검색 결과가 없습니다.</div>';results.classList.remove('hidden')}
document.querySelector('#searchBtn').onclick=doSearch;document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
