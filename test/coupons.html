<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c12"><title>쿠폰코드 | LAST ASYLUM 공략</title><link rel="stylesheet" href="./fantasy.css"><script src="./coupon-config.js"></script></head><body><main class="shell"><nav class="nav"><a class="smallbtn" href="./">‹ 이전</a><button class="smallbtn" type="button" id="resetBtn">초기화</button></nav><header class="brand"><div><small>LAST ASYLUM · REDEMPTION</small><h1>쿠폰코드</h1></div></header><section class="summary"><p>아직 사용 완료하지 않은 코드</p><b id="remainingCount">확인 중…</b><div class="statsrow"><span id="doneCount">사용 완료 0개</span><span id="updated">목록 갱신 중</span></div></section><div class="actions"><button class="action" type="button" id="reportFail">코드 사용이 안 돼요</button><button class="action add" type="button" id="reportAdd">코드 추가 요청</button></div><div class="heading"><h2>쿠폰 목록</h2><small id="listCount"></small></div><div class="list" id="codeList"></div><details class="fold" id="usedDetails"><summary id="usedSummary">사용 완료 코드 (0)</summary><div class="fold-body" id="usedList"></div></details><p class="note">사용 완료 기록은 내 브라우저에만 저장돼요. 공식 디스코드 공지는 자동 등록되며, 이용자 제보는 관리자 확인 후 추가됩니다.</p><footer class="page-footer">LAST ASYLUM · #252 CROW</footer></main><div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modal"><div class="modalheader"><h2 id="dialogTitle">코드 제보</h2><button class="x" type="button" aria-label="닫기" id="closeModal">×</button></div><p id="dialogIntro"></p><form id="reportForm"><label class="field">쿠폰코드<input id="reportCode" name="code" maxlength="24" autocomplete="off" spellcheck="false" placeholder="코드를 입력해주세요" required></label><label class="field" id="reasonWrap">확인 결과<select id="reportReason"><option value="invalid">코드가 유효하지 않아요</option><option value="expired">만료된 것 같아요</option><option value="other">기타 문제</option></select></label><label class="field">추가 설명 (선택)<textarea id="reportNote" maxlength="300" placeholder="어떤 메시지가 나왔는지 알려주세요."></textarea></label><div id="modalNotice" class="modalnotice" aria-live="polite"></div><button class="submit" type="submit" id="submitReport">관리자에게 제보하기</button></form></div></div><div class="toast" id="toast" aria-live="polite" role="status"></div><script src="./coupons.js"></script></body></html>
