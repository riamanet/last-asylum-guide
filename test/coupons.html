</style></head><body><main class="shell"><nav class="nav"><a class="smallbtn" href="./">‹ 이전</a><button class="smallbtn" type="button" id="resetBtn">↺ 초기화</button></nav><header class="brand"><small>#252 CROW 달콩쓰</small><h1>쿠폰코드</h1></header><section class="summary"><p>아직 사용 완료하지 않은 코드</p><b id="remainingCount">확인 중…</b><div class="statsrow"><span id="doneCount">사용 완료 0개</span><span id="updated">목록 갱신 중</span></div></section><div class="actions"><button class="action" id="reportFail" type="button">코드 사용이 안 돼요</button><button class="action add" id="reportAdd" type="button">＋ 코드 추가해주세요</button></div><div class="heading"><h2>쿠폰 목록</h2><small id="listCount"></small></div><div class="list" id="codeList"></div><details class="fold" id="usedDetails"><summary id="usedSummary">사용 완료 코드 (0)</summary><div class="fold-body" id="usedList"></div></details><p class="note">사용 완료 기록은 내 브라우저에만 저장돼요. 공식 디스코드 공지는 자동 등록되며, 이용자 제보는 관리자 확인 후 추가됩니다.</p></main><div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modal"><div class="modalheader"><h2 id="dialogTitle">코드 제보</h2><button class="x" type="button" aria-label="닫기" id="closeModal">×</button></div><p id="dialogIntro"></p><form id="reportForm"><label class="field">쿠폰코드<input id="reportCode" name="code" maxlength="24" autocomplete="off" spellcheck="false" placeholder="코드를 입력해주세요" required></label><label class="field" id="reasonWrap">확인 결과<select id="reportReason"><option value="invalid">코드가 유효하지 않아요</option><option value="expired">만료된 것 같아요</option><option value="other">기타 문제</option></select></label><label class="field">추가 설명 (선택)<textarea id="reportNote" maxlength="300" placeholder="어떤 메시지가 나왔는지 알려주세요."></textarea></label><div id="modalNotice" class="modalnotice" aria-live="polite"></div><button class="submit" type="submit" id="submitReport">관리자에게 제보하기</button></form></div></div><div class="toast" id="toast" aria-live="polite" role="status"></div><script>
'use strict';
const FALLBACK={updated:'2026-10-19',codes:['LAGRAN26','LA26CAFE1','LACAFE26','LA30W7F2M','LA25W8CM','LA20WBZ9','LA15WPN4D','LA1OW9F7X','LADCEX1223','LAKR15K9A','LAKR12K7O','LAKR10K6L','LAPKOR777','LAPJAP777','LAAS777','WLTLAP','61HW4LA','twlap666','twlap888'],blocked:['LAHD26','LAOKT26','LA14EBRN','LAQIXI26']};
const STORAGE_KEY='last_asylum_guide_used_coupons_v1';
const endpoint=(window.LAST_ASYLUM_COUPON_ENDPOINT||'').trim();
const hasBackend=/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(endpoint);
const $=s=>document.getElementById(s);let baseData=FALLBACK,sheetData=null,data=FALLBACK,done=new Set(),reportType='add',toastTimer;
const cleanCode=s=>String(s||'').trim().replace(/\s/g,'');const codeKey=s=>cleanCode(s).toUpperCase();
const list=a=>Array.isArray(a)?a.map(cleanCode).filter(s=>/^[A-Za-z0-9]{5,24}$/.test(s)):[];
const ORIGINAL_CASE={TWLAP666:'twlap666',TWLAP888:'twlap888','2GM3EYXYA':'2gm3eYxYa'};
try{const cached=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(cached))done=new Set(cached.map(codeKey));}catch(_){}
function applySources(){const blocked=new Map();for(const c of [...list(baseData.blocked),...list(sheetData?.blocked)])blocked.set(codeKey(c),c);const items=new Map();for(const c of [...list(sheetData?.codes),...list(baseData.codes)]){const k=codeKey(c);if(!blocked.has(k))items.set(k,ORIGINAL_CASE[k]||c)}data={updated:[baseData.updated,sheetData?.updated].filter(Boolean).sort().at(-1)||'미확인',codes:[...items.values()],blocked:[...blocked.values()]};render()}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...done]))}catch(_){showToast('사용 내역 저장에 실패했어요')}}
function showToast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function elem(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function copyCode(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const e=elem('textarea');e.value=text;e.style.position='fixed';e.style.opacity='0';document.body.append(e);e.select();if(!document.execCommand('copy'))throw Error('copy failed');e.remove()}showToast(text+' 복사했어요')}catch(_){prompt('길게 눌러 코드를 복사해 주세요',text)}}
function render(){const active=data.codes.filter(c=>!done.has(codeKey(c))),finished=data.codes.filter(c=>done.has(codeKey(c)));$('remainingCount').textContent=active.length+'개';$('doneCount').textContent='사용 완료 '+finished.length+'개';$('updated').textContent='업데이트 '+data.updated;$('listCount').textContent=active.length+'개';$('usedSummary').textContent=`사용 완료 코드 (${finished.length})`;const main=$('codeList');main.replaceChildren();if(!active.length)main.append(elem('div','empty','모든 코드를 사용 완료했어요!'));for(const code of active){const card=elem('article','coupon'),label=elem('div','value',code),tools=elem('div','right'),copy=elem('button','copy','복사'),mark=elem('button','markused','✓ 사용완료');copy.type='button';copy.onclick=()=>copyCode(code);mark.type='button';mark.setAttribute('aria-label',code+' 사용 완료');mark.onclick=()=>{done.add(codeKey(code));save();render();showToast('사용 완료 목록으로 옮겼어요')};tools.append(copy,mark);card.append(label,tools);main.append(card)}const usedList=$('usedList');usedList.replaceChildren();if(!finished.length)usedList.append(elem('div','empty','사용 완료한 코드는 아직 없어요.'));finished.forEach(code=>{const row=elem('div','fold-row');row.append(elem('b','',code));const btn=elem('button','restore','되돌리기');btn.onclick=()=>{done.delete(codeKey(code));save();render()};row.append(btn);usedList.append(row)})}
async function load(){applySources();try{const r=await fetch('./codes.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.codes)){baseData=j;applySources()}}}catch(_){}if(hasBackend){const cb='__lastAsylumCouponPage',script=document.createElement('script');window[cb]=j=>{if(j&&Array.isArray(j.codes)){sheetData=j;applySources()}script.remove();delete window[cb]};script.onerror=()=>{script.remove();delete window[cb]};script.src=endpoint+'?callback='+cb+'&t='+Date.now();document.head.append(script)}}
$('resetBtn').onclick=()=>{if(!done.size){showToast('초기화할 사용 내역이 없어요');return}if(confirm('사용 완료 체크를 모두 초기화할까요?')){done.clear();save();$('usedDetails').open=false;render();showToast('모든 코드가 다시 표시돼요')}};
function modal(type){reportType=type;$('dialogTitle').textContent=type==='add'?'＋ 쿠폰코드 추가 요청':'코드 사용 불가 제보';$('dialogIntro').textContent=type==='add'?'새 쿠폰코드를 알려주시면 관리자가 검토한 뒤 등록합니다.':'게임에서 쿠폰이 적용되지 않는 경우 제보해 주세요. 이미 등록한 계정에서만 사용 불가한 경우는 제외해 주세요.';$('reasonWrap').classList.toggle('hidden',type==='add');$('reportForm').reset();$('modalNotice').textContent='';$('overlay').classList.remove('hidden');$('reportCode').focus()}
$('reportAdd').onclick=()=>modal('add');$('reportFail').onclick=()=>modal('invalid');$('closeModal').onclick=()=>$('overlay').classList.add('hidden');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.add('hidden')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.add('hidden')});
$('reportForm').onsubmit=async e=>{e.preventDefault();const code=cleanCode($('reportCode').value),note=$('reportNote').value.trim().slice(0,300),reason=reportType==='add'?'suggest':$('reportReason').value,set=new Set(data.codes.map(codeKey)),blocked=new Set(data.blocked.map(codeKey)),info=$('modalNotice');if(!/^[A-Za-z0-9]{5,24}$/.test(code)){info.textContent='영문·숫자로 된 코드 5~24자를 입력해주세요.';return}if(reportType==='add'&&set.has(codeKey(code))){info.textContent='이미 목록에 등록된 코드예요.';return}if(reportType==='add'&&blocked.has(codeKey(code))){info.textContent='이전에 사용 불가로 제보된 코드라 중복 등록되지 않아요.';return}if(reportType==='invalid'&&blocked.has(codeKey(code))){info.textContent='이미 사용 불가로 분류된 코드예요.';return}if(hasBackend){const payload=new URLSearchParams({action:'report',type:reportType,code,reason,note});try{await fetch(endpoint,{method:'POST',mode:'no-cors',body:payload,keepalive:true});$('overlay').classList.add('hidden');showToast('제보 전송 요청 완료 · 관리자 검토 대기')}catch(_){info.textContent='전송이 실패했어요. 잠시 후 다시 시도해주세요.'}return}const title=(reportType==='add'?'[쿠폰 추가 요청] ':'[사용 불가 제보] ')+code,body=`종류: ${reportType}\n코드: ${code}\n사유: ${reason}\n설명: ${note||'(없음)'}\n※ 관리자 확인 후 반영 부탁드립니다.`,url='https://github.com/riamanet/last-asylum-guide/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);if(confirm('제보를 제출하려면 GitHub 로그인이 필요해요. 제보 작성 화면을 열까요?'))window.open(url,'_blank','noopener,noreferrer')};load();
</script></body></html>
